org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Java 8 bytecode is a deliberate floor: the AAR stays consumable by the oldest
# toolchains Media3 itself supports. This silences javac 21's "source value 8 is
# obsolete" note; revisit when Media3 raises its own baseline.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
