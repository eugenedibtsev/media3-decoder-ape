plugins {
    id 'com.android.library' version '8.12.3' apply false
    id 'com.android.application' version '8.12.3' apply false
}

// Javac hygiene for every module. Deprecation warnings are printed per call
// site rather than folded into javac's one-line "recompile with
// -Xlint:deprecation" note, which is how a batch of deprecated Media3 calls
// once went unnoticed. Deliberately not -Werror: the -Pmedia3Override probe
// builds against Media3 versions newer than the declared one, and an API newly
// deprecated there should surface as a warning, not kill the probe.
// -Xlint:-options silences JDK 21's "source value 8 is obsolete" chatter; the
// Java 8 floor is deliberate, documented in gradle.properties.
subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.deprecation = true
        options.compilerArgs << '-Xlint:-options'
    }
}
