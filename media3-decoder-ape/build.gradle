apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

group = 'io.github.eugenedibtsev'
version = '1.0.0'

ext {
    media3Version = '1.10.1'
}

// Compatibility probe. `-Pmedia3Override=<version>` resolves every
// androidx.media3 artifact at that version without touching the declared
// dependency, so the module can be built and tested against newer Media3
// releases the way a consumer would pull them in.
if (project.hasProperty('media3Override')) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'androidx.media3') {
                details.useVersion project.property('media3Override')
                details.because 'media3Override compatibility probe'
            }
        }
    }
}

android {
    namespace = 'io.github.eugenedibtsev.media3.ape'
    compileSdk 36
    // Pinned so third-party builds reproduce the .so we test against.
    ndkVersion = '27.0.12077973'

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                targets 'apeJNI'
            }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // The androidTest APK has to be signed to install; the debug keystore is enough
            // for on-device measurement.
            signingConfig = signingConfigs.debug
        }
    }

    // Instrumentation tests run against the release variant: AGP builds the native code with
    // CMake's Debug configuration (no -O flag at all, so -O0) for debuggable variants, which
    // penalizes the NEON kernels roughly tenfold and makes every performance number meaningless.
    testBuildType = 'release'

    testOptions {
        targetSdk = 34
    }

    publishing {
        singleVariant('release') {
            // Maven Central rejects deployments without sources and javadoc jars.
            withSourcesJar()
            withJavadocJar()
        }
    }
}

// Configure the native build only if the MACLib sources are present, so that
// gradle sync does not fail before download_maclib.sh has been run.
if (project.file('src/main/jni/maclib').exists()) {
    android.externalNativeBuild.cmake {
        path = 'src/main/jni/CMakeLists.txt'
        version = '3.21.0+'
    }
}

dependencies {
    api "androidx.media3:media3-extractor:$media3Version"
    api "androidx.media3:media3-common:$media3Version"
    // api: @Nullable appears in public signatures.
    api 'androidx.annotation:annotation:1.9.1'
    compileOnly 'org.checkerframework:checker-qual:3.13.0'
    // Media3's NonNullApi is meta-annotated with kotlin.annotations.jvm.UnderMigration;
    // without this class file javac warns "unknown enum constant MigrationStatus.STRICT"
    // on every compilation that touches a Media3 type. Annotations only, nothing ships.
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:2.2.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'com.google.truth:truth:1.4.4'
    androidTestImplementation "androidx.media3:media3-exoplayer:$media3Version"
}

// ---------------------------------------------------------------------------
// Public API snapshot. `apiDump` regenerates api/media3-decoder-ape.api from
// the release classes; `apiCheck` fails when the current public surface
// differs from the committed snapshot. Baseline for 1.0.0 compatibility.
// ---------------------------------------------------------------------------
def buildApiDump = { File aarFile, File workDir ->
    def classesDir = new File(workDir, 'classes')
    project.delete(workDir)
    project.copy { from project.zipTree(aarFile); include 'classes.jar'; into workDir }
    project.copy { from project.zipTree(new File(workDir, 'classes.jar')); into classesDir }
    def classNames = project.fileTree(dir: classesDir, includes: ['**/*.class']).files
            .collect { f ->
                classesDir.toPath().relativize(f.toPath()).toString()
                        .replace(File.separatorChar, '.' as char).replaceAll(/\.class$/, '')
            }
            .sort()
    def javap = new File(System.getProperty('java.home'),
            'bin/javap' + (System.getProperty('os.name').toLowerCase().contains('win') ? '.exe' : ''))
    def command = [javap.absolutePath, '-public', '-classpath', classesDir.absolutePath] + classNames
    def process = command.execute()
    def output = new StringWriter()
    def error = new StringWriter()
    process.waitForProcessOutput(output, error)
    if (process.exitValue() != 0) {
        throw new GradleException("javap failed: ${error}")
    }
    // Keep only the blocks of classes that are themselves public.
    def result = new StringBuilder()
    def keep = false
    output.toString().readLines().each { line ->
        if (line.startsWith('Compiled from')) return
        if (!line.startsWith(' ') && (line.contains('class ') || line.contains('interface '))) {
            keep = line.startsWith('public ')
        }
        if (keep && !line.isEmpty()) {
            result.append(line).append('\n')
        }
    }
    return result.toString()
}

// ---------------------------------------------------------------------------
// Publishing. Local `publish...ToStagingRepository` writes a Maven layout to
// build/staging-deploy; the publish workflow bundles that directory and
// uploads it to the Sonatype Central Portal. Credentials and the GPG key
// come exclusively from the environment; unsigned local publishes work when
// SIGNING_KEY is unset.
// ---------------------------------------------------------------------------
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                pom {
                    name = 'media3-decoder-ape'
                    description = "Monkey's Audio (APE) extractor and decoder for AndroidX Media3, built on the official MACLib."
                    url = 'https://github.com/eugenedibtsev/media3-decoder-ape'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'eugenedibtsev'
                            name = 'Eugene Dibtsev'
                            url = 'https://github.com/eugenedibtsev'
                            email = '287062323+eugenedibtsev@users.noreply.github.com'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/eugenedibtsev/media3-decoder-ape.git'
                        developerConnection = 'scm:git:ssh://git@github.com/eugenedibtsev/media3-decoder-ape.git'
                        url = 'https://github.com/eugenedibtsev/media3-decoder-ape'
                    }
                }
            }
        }
        repositories {
            maven {
                name = 'staging'
                url = layout.buildDirectory.dir('staging-deploy')
            }
        }
    }

    signing {
        def signingKey = System.getenv('SIGNING_KEY')
        def signingPassword = System.getenv('SIGNING_PASSWORD')
        if (signingKey != null) {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.release
        }
    }
}

def apiSnapshotFile = file('api/media3-decoder-ape.api')

tasks.register('apiDump') {
    dependsOn 'assembleRelease'
    notCompatibleWithConfigurationCache('runs javap on build outputs')
    doLast {
        def dump = buildApiDump(
                file("${buildDir}/outputs/aar/media3-decoder-ape-release.aar"),
                new File(buildDir, 'tmp/apiDump'))
        apiSnapshotFile.parentFile.mkdirs()
        apiSnapshotFile.setText(dump, 'UTF-8')
        logger.lifecycle("Public API written to ${apiSnapshotFile}")
    }
}

tasks.register('apiCheck') {
    dependsOn 'assembleRelease'
    notCompatibleWithConfigurationCache('runs javap on build outputs')
    doLast {
        if (!apiSnapshotFile.exists()) {
            throw new GradleException("API snapshot ${apiSnapshotFile} is missing; run :media3-decoder-ape:apiDump")
        }
        def current = buildApiDump(
                file("${buildDir}/outputs/aar/media3-decoder-ape-release.aar"),
                new File(buildDir, 'tmp/apiCheck'))
        def expected = apiSnapshotFile.getText('UTF-8').replace('\r\n', '\n')
        if (current.replace('\r\n', '\n') != expected) {
            throw new GradleException(
                    'Public API differs from the committed snapshot. Review the change and run ' +
                    ':media3-decoder-ape:apiDump if it is intentional.')
        }
        logger.lifecycle('Public API matches the committed snapshot.')
    }
}
