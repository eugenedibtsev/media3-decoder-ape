apply plugin: 'com.android.application'

android {
    namespace = 'io.github.eugenedibtsev.media3.ape.sample'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.eugenedibtsev.media3.ape.sample'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':media3-decoder-ape')
    // Tracks the library's own Media3 version instead of repeating it.
    implementation "androidx.media3:media3-exoplayer:${project(':media3-decoder-ape').media3Version}"
    implementation "androidx.media3:media3-ui:${project(':media3-decoder-ape').media3Version}"
}
